[project]
name = "wiki"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.4.0",
    "fastapi[standard]>=0.138.0",
    "httpx2>=2.10.0",
    "pandas>=3.0.1",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.46",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
]

[tool.ruff.lint]
select = ["E","F","I"]
ignore = ["E501"]
